#:schema https://developers.openai.com/codex/config-schema.json

approval_policy = "never"
model = "gpt-5.6-luna"
model_reasoning_effort = "medium"
personality = "pragmatic"
sandbox_mode = "danger-full-access"
web_search = "live"
plan_mode_reasoning_effort = "medium"

# managed by hermes-agent — `hermes codex-runtime migrate` regenerates this section

default_permissions = ":danger-full-access"
service_tier = "default"

# end hermes-agent managed section

suppress_unstable_features_warning = true

[features]
apply_patch_streaming_events = true
chronicle = true
code_mode = true
code_mode_buffered_exec = true
code_mode_only = true
default_mode_request_user_input = true
hooks = false
multi_agent = true
multi_agent_v2 = true
network_proxy = true
prevent_idle_sleep = true
js_repl = false

[feedback]
enabled = false

[skills]
include_instructions = false

[mcp_servers]

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp?tools=web_search_exa,web_search_advanced_exa,web_fetch_exa"

[mcp_servers.exa.env_http_headers]
x-api-key = "EXA_API_KEY"

[otel]
exporter = "none"
log_user_prompt = false
trace_exporter = "none"

[tui]
alternate_screen = "never"
animations = false
status_line = [
    "model-with-reasoning",
    "used-tokens",
    "five-hour-limit",
    "weekly-limit",
    "current-dir",
    "git-branch",
]
theme = "nord"

[tui.keymap.editor]
insert_newline = ["ctrl-j", "ctrl-m", "shift-enter", "alt-enter"]

[windows]
sandbox = "unelevated"

[desktop]
sansFontSize = 12
codeFontSize = 12
usePointerCursors = true
followUpQueueMode = "queue"
integratedTerminalShell = "gitBash"
git-commit-instructions = "Read the changes thoroughly and try to understand the exact feature or the bug fix or the exact code refactoring methodology which was done to do the commits. Then make the commit message."
git-pr-instructions = """
1. Create a summary of the things which have been changed.
2. Create a change log of bullet points of the things that have changed in the change log. Do not add code-related stuff, but only add features, bug fixes, or exact refactorations which are being done in the PR.
3. At the last, add a confidence code for the PR as a reviewer."""
keepRemoteControlAwakeWhilePluggedIn = true
appearanceLightCodeThemeId = "catppuccin"
appearanceDarkCodeThemeId = "catppuccin"
git-show-sidebar-pr-icons = true
git-branch-prefix = ""
git-create-pull-request-as-draft = false
open-local-url-in-target-preference = "external-browser"
conversationDetailMode = "STEPS_COMMANDS"
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "max"]
appearanceDiffMarkerStyle = "color"
runCodexInWindowsSubsystemForLinux = false
show-context-window-usage = true

[desktop.open-in-target-preferences]
global = "cursor"

[desktop.appearanceLightChromeTheme]
accent = "#8839ef"
contrast = 48
ink = "#4c4f69"
opaqueWindows = false
surface = "#eff1f5"

[desktop.appearanceLightChromeTheme.fonts]
code = '"Jetbrains Mono"'
ui = "Inter"

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#40a02b"
diffRemoved = "#d20f39"
skill = "#8839ef"

[desktop.appearanceDarkChromeTheme]
accent = "#cba6f7"
contrast = 60
ink = "#cdd6f4"
opaqueWindows = false
surface = "#1e1e2e"

[desktop.appearanceDarkChromeTheme.fonts]

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#a6e3a1"
diffRemoved = "#f38ba8"
skill = "#cba6f7"

[memories]
generate_memories = false
use_memories = false
