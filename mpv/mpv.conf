# Modern Windows playback profile for an SDR panel.
# D3D11 keeps rendering and hardware decoding on the display-connected integrated GPU.
profile=high-quality
vo=gpu-next
gpu-api=d3d11
hwdec=auto

# Playback and window behaviour.
fs=yes
keep-open=yes
save-position-on-quit=yes
image-display-duration=0.8
osd-bar=no
cursor-autohide=100

# Subtitles and online video.
slang=en
sub-auto=exact
sub-scale=0.500
ytdl-format=bv*+ba/b
ytdl-raw-options=sub-langs=en.*,write-subs=

# Animated images should loop five times.
[extension.gif]
loop-file=5

# Optional discrete-GPU renderer. Start mpv with --profile=nvidia-quality when
# shader-heavy scaling makes the Intel renderer the bottleneck.
[nvidia-quality]
gpu-api=vulkan
# vulkan-device=YOUR_NVIDIA_GPU_NAME
hwdec=auto
