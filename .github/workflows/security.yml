name: Security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks full history
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out all branches and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks from GitHub
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # pragma: allowlist secret
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          install_dir="${RUNNER_TEMP}/gitleaks"

          mkdir -p "${install_dir}"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors \
            --output "${RUNNER_TEMP}/${archive}" \
            "${url}"

          printf '%s  %s\n' \
            "${GITLEAKS_SHA256}" \
            "${RUNNER_TEMP}/${archive}" |
            sha256sum --check --strict

          tar -xzf "${RUNNER_TEMP}/${archive}" \
            -C "${install_dir}" \
            gitleaks

          "${install_dir}/gitleaks" version

      - name: Scan every reachable commit
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gitleaks/gitleaks" git \
            --no-banner \
            --no-color \
            --redact=100 \
            --log-opts="--all" \
            "${GITHUB_WORKSPACE}"

  sensitive-information:
    name: Sensitive information and repository structure
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out all branches and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Audit commit metadata and every historical blob
        shell: pwsh
        run: ./.github/scripts/audit-repository.ps1
